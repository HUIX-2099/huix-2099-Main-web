<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B0D" />
      <stop offset="1" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="orangeInk" x1="120" y1="220" x2="620" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A1F" />
      <stop offset="1" stop-color="#E55400" />
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.4 0" />
    </filter>
    <mask id="pocketCut">
      <rect x="0" y="0" width="800" height="800" fill="white" />
      <circle cx="310" cy="360" r="135" fill="black" />
    </mask>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow)" />

  <g filter="url(#cardShadow)" transform="translate(50 40)">
    <rect x="70" y="120" width="600" height="520" rx="18" fill="#0F0F11" stroke="#1C1C1F" stroke-width="2" />
    <rect x="70" y="120" width="600" height="520" rx="18" fill="#0F0F11" opacity="0.07" filter="url(#noise)" />

    <!-- top slate -->
    <rect x="150" y="120" width="440" height="105" rx="12" fill="#16171B" stroke="#1E2026" />
    <g fill="#B7BAC6" font-family="'SF Pro Display','Inter','Segoe UI',sans-serif" font-size="20" font-weight="600">
      <text x="175" y="154">7412-3652847</text>
      <text x="175" y="182">309-23</text>
      <text x="175" y="208">000 53698-411</text>
      <circle cx="490" cy="150" r="8" fill="none" stroke="#70727C" stroke-width="2" />
      <text x="508" y="158">49 7 023</text>
      <text x="490" y="198" font-size="56" font-weight="700" fill="#C8CAD3">9658</text>
      <text x="480" y="238" font-size="52" font-weight="600" fill="#9EA1AC">0037601</text>
    </g>

    <!-- accent tab -->
    <rect x="40" y="380" width="18" height="68" rx="4" fill="#FF7A1F" />

    <!-- orange core card -->
    <rect x="110" y="230" width="540" height="180" rx="12" fill="url(#orangeInk)" />
    <rect x="110" y="230" width="540" height="180" rx="12" fill="#000" opacity="0.05" filter="url(#noise)" />

    <g fill="#1F1C1C" font-family="'SF Pro Display','Inter','Segoe UI',sans-serif" font-weight="700">
      <text x="140" y="285" font-size="62">5427</text>
      <text x="140" y="330" font-size="64">01853409</text>
    </g>
    <g fill="#321C12" font-family="'SF Pro Display','Inter','Segoe UI',sans-serif" font-size="18" font-weight="600">
      <text x="415" y="280">© 36 9 011</text>
      <text x="475" y="305">2236-0542702</text>
      <text x="530" y="330">196-19</text>
      <text x="470" y="350">000 15</text>
    </g>

    <!-- pocket with cut-out -->
    <g mask="url(#pocketCut)">
      <rect x="70" y="290" width="600" height="350" rx="14" fill="#0D0D0E" stroke="#1B1B20" />
      <rect x="70" y="290" width="600" height="350" rx="14" fill="#15151A" opacity="0.08" filter="url(#noise)" />
    </g>

    <!-- badge clip -->
    <rect x="620" y="320" width="18" height="90" rx="6" fill="#1C1C20" />
    <rect x="638" y="332" width="24" height="70" rx="6" fill="#101014" stroke="#1C1C20" />
    <circle cx="650" cy="368" r="12" fill="none" stroke="#2E2E37" stroke-width="2" />
    <line x1="662" y1="400" x2="690" y2="440" stroke="#9EA1AC" stroke-width="2" />
    <circle cx="700" cy="456" r="28" stroke="#9EA1AC" stroke-width="4" fill="none" />

    <!-- subtle glow -->
    <ellipse cx="370" cy="620" rx="210" ry="60" fill="#FF6A00" opacity="0.08" />
  </g>
</svg>












