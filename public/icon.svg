<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HUIX-2099">
  <defs>
    <style>
      .dark-icon { display: block; }
      .light-icon { display: none; }
      @media (prefers-color-scheme: light) {
        .dark-icon { display: none; }
        .light-icon { display: block; }
      }
    </style>
    <clipPath id="clip">
      <rect width="180" height="180" rx="32" />
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <image
      class="dark-icon"
      href="/icons/HUIX 2099 dark logo icon version.jpg"
      width="180"
      height="180"
      preserveAspectRatio="xMidYMid slice"
    />
    <image
      class="light-icon"
      href="/icons/HUIX 2099 light logo icon version.jpg"
      width="180"
      height="180"
      preserveAspectRatio="xMidYMid slice"
    />
  </g>
</svg>